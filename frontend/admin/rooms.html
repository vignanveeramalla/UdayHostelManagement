<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rooms - Uday Hostel</title>

    <link rel="stylesheet"
          href="CSS/style.css">

</head>


<body>


<div class="dashboard-layout">


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">


        <div class="logo">

            <h2>Uday Hostel</h2>

            <p>Management System</p>

        </div>


        <nav>

            <a href="dashboard.html">
                🏠 Dashboard
            </a>


            <a href="students.html">
                👨🏻‍🎓 Students
            </a>


            <a href="rooms.html" class="active">
                🏢 Rooms
            </a>


            <a href="payments.html">
                💰 Payments
            </a>


            <a href="complaints.html">
                📢 Complaints
            </a>


            <a href="enquiries.html">
                ✉ Enquiries
            </a>


            <a href="facilities.html">
                🛠️ Facilities
            </a>


            <a href="admin.html">
                👤 Admin
            </a>

        </nav>


        <button
            class="logout-button"
            onclick="logout()">

            ➜🚪 Logout

        </button>


    </aside>



    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">


        <!-- HEADER -->

        <header class="top-header">


            <div>

                <h1>Rooms</h1>

                <p>Room Management</p>

            </div>


            <a href="admin.html" class="admin-info">
                <span>Admin</span>
            </a>


        </header>



        <!-- MESSAGE -->

        <div id="message"></div>



        <!-- ================= ROOM TABLE ================= -->

        <section class="student-section">


            <div class="section-header">


                <h2>All Rooms</h2>


                <button
                    id="addRoomButton"
                    onclick="showAddRoomForm()">

                    + Add Room

                </button>


            </div>



            <div class="table-container">


                <table>


                    <thead>

                        <tr>

                            <th>Room No</th>

                            <th>Capacity</th>

                            <th>Floor</th>

                            <th>Occupied</th>

                            <th>Available</th>

                            <th>Status</th>

                            <th>Actions</th>

                        </tr>

                    </thead>



                    <tbody id="roomTableBody">


                        <tr>

                            <td colspan="7">

                                Loading rooms....

                            </td>

                        </tr>


                    </tbody>


                </table>


            </div>


        </section>



        <!-- ================= ADD / EDIT ROOM FORM ================= -->

        <div
            id="roomFormContainer"
            class="form-container"
            style="display:none;">


            <h2 id="roomFormTitle">
                Add Room
            </h2>



            <form id="roomForm">


                <!-- ROOM NUMBER -->

                <label>
                    Room Number
                </label>


                <input
                    type="number"
                    id="roomNo"
                    placeholder="Enter room number"
                    required>



                <!-- CAPACITY -->

                <label>
                    Capacity
                </label>


                <input
                    type="number"
                    id="capacity"
                    placeholder="Enter capacity"
                    required>



                <!-- FLOOR -->

                <label>
                    Floor
                </label>


                <input
                    type="number"
                    id="floor"
                    placeholder="Enter floor"
                    required>



                <button
                    type="submit"
                    id="roomSubmitButton">

                    Save Room

                </button>



                <button
                    type="button"
                    onclick="hideRoomForm()">

                    Cancel

                </button>


            </form>


        </div>


    </main>


</div>



<script src="JS/rooms.js"></script>


</body>

</html>
