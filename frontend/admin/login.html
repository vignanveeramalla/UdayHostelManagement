<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login-Uday Hostel</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>


<body>

    <div class="login-container">

        <!-- Heading -->

        <h1>UDAY HOSTEL</h1>

        <h2>Admin Login</h2>


        <!-- Login Form -->

        <form id="loginForm">

            <!-- Email -->

            <div class="login-row">

                <label for="username">
                    Email
                </label>

                <input
                    type="email"
                    id="username"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="login-row">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- Login Button -->

            <button type="submit">
                Login
            </button>

        </form>


        <!-- Message -->

        <p id="message"></p>

    </div>


    <script src="JS/login.js"></script>

</body>

</html>
